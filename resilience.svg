<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="9 commits to merge my first pull request, then five upstream fixes in Celery and Microsoft Agent Framework" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="300" rx="18" fill="#0d1117"/>
  <rect x="1" y="1" width="998" height="298" rx="17" fill="none" stroke="#30363d"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="40" font-size="15" fill="#8b949e">// 9 commits → 5 upstream fixes</text>

    <!-- base rail -->
    <line x1="60" y1="140" x2="500" y2="140" stroke="#30363d" stroke-width="2" stroke-dasharray="4 6"/>

    <!-- nine commits -->
    <g font-size="13" text-anchor="middle" font-weight="700">
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0300;0.0500;0.9;1" dur="16s" repeatCount="indefinite"/><circle cx="60" cy="140" r="16" fill="#161b22" stroke="#a78bfa" stroke-width="2"/><text x="60" y="145" fill="#c4b5fd">1</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0644;0.0844;0.9;1" dur="16s" repeatCount="indefinite"/><circle cx="115" cy="140" r="16" fill="#161b22" stroke="#a78bfa" stroke-width="2"/><text x="115" y="145" fill="#c4b5fd">2</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0988;0.1188;0.9;1" dur="16s" repeatCount="indefinite"/><circle cx="170" cy="140" r="16" fill="#161b22" stroke="#a78bfa" stroke-width="2"/><text x="170" y="145" fill="#c4b5fd">3</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1331;0.1531;0.9;1" dur="16s" repeatCount="indefinite"/><circle cx="225" cy="140" r="16" fill="#161b22" stroke="#a78bfa" stroke-width="2"/><text x="225" y="145" fill="#c4b5fd">4</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1675;0.1875;0.9;1" dur="16s" repeatCount="indefinite"/><circle cx="280" cy="140" r="16" fill="#161b22" stroke="#a78bfa" stroke-width="2"/><text x="280" y="145" fill="#c4b5fd">5</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2019;0.2219;0.9;1" dur="16s" repeatCount="indefinite"/><circle cx="335" cy="140" r="16" fill="#161b22" stroke="#a78bfa" stroke-width="2"/><text x="335" y="145" fill="#c4b5fd">6</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2363;0.2563;0.9;1" dur="16s" repeatCount="indefinite"/><circle cx="390" cy="140" r="16" fill="#161b22" stroke="#a78bfa" stroke-width="2"/><text x="390" y="145" fill="#c4b5fd">7</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2706;0.2906;0.9;1" dur="16s" repeatCount="indefinite"/><circle cx="445" cy="140" r="16" fill="#161b22" stroke="#a78bfa" stroke-width="2"/><text x="445" y="145" fill="#c4b5fd">8</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3050;0.3250;0.9;1" dur="16s" repeatCount="indefinite"/><circle cx="500" cy="140" r="16" fill="#161b22" stroke="#a78bfa" stroke-width="2"/><text x="500" y="145" fill="#c4b5fd">9</text></g>
      <!-- merged overlay on 9 -->
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.36;0.38;0.9;1" dur="16s" repeatCount="indefinite"/>
        <circle cx="500" cy="140" r="19" fill="#052e1a" stroke="#34d399" stroke-width="3" filter="url(#glow)"/>
        <text x="500" y="147" font-size="20" fill="#34d399">✓</text>
      </g>
    </g>

    <!-- merged caption -->
    <g opacity="0" text-anchor="middle">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.38;0.42;0.9;1" dur="16s" repeatCount="indefinite"/>
      <text x="500" y="190" font-size="13" font-weight="700" fill="#34d399">merged · after full review</text>
      <text x="500" y="208" font-size="11" fill="#8b949e">Open Food Facts, accessibility fix</text>
    </g>
    <text x="60" y="190" font-size="13" fill="#a78bfa" opacity="0">my first PR
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.03;0.06;0.9;1" dur="16s" repeatCount="indefinite"/>
    </text>

    <!-- growth line -->
    <line x1="516" y1="140" x2="516" y2="140" stroke="#34d399" stroke-width="3" filter="url(#glow)">
      <animate attributeName="x2" values="516;516;940;940;516" keyTimes="0;0.42;0.60;0.9;1" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;1;1;0" keyTimes="0;0.42;0.6;0.9;1" dur="16s" repeatCount="indefinite"/>
    </line>

    <!-- five upstream fixes -->
    <g text-anchor="middle" font-size="12">
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.47;0.5;0.9;1" dur="16s" repeatCount="indefinite"/><circle cx="580" cy="140" r="10" fill="#22d3ee" filter="url(#glow)"/><text x="580" y="122" fill="#67e8f9">#10461</text><text x="580" y="170" font-size="10" fill="#8b949e">celery</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.52;0.55;0.9;1" dur="16s" repeatCount="indefinite"/><circle cx="665" cy="140" r="10" fill="#22d3ee" filter="url(#glow)"/><text x="665" y="122" fill="#67e8f9">#10493</text><text x="665" y="170" font-size="10" fill="#8b949e">celery</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.57;0.6;0.9;1" dur="16s" repeatCount="indefinite"/><circle cx="750" cy="140" r="10" fill="#22d3ee" filter="url(#glow)"/><text x="750" y="122" fill="#67e8f9">#10497</text><text x="750" y="170" font-size="10" fill="#8b949e">celery</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.62;0.65;0.9;1" dur="16s" repeatCount="indefinite"/><circle cx="835" cy="140" r="10" fill="#22d3ee" filter="url(#glow)"/><text x="835" y="122" fill="#67e8f9">#10510</text><text x="835" y="170" font-size="10" fill="#8b949e">celery</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.67;0.7;0.9;1" dur="16s" repeatCount="indefinite"/><circle cx="920" cy="140" r="10" fill="#f472b6" filter="url(#glow)"/><text x="920" y="122" fill="#f9a8d4">#7901</text><text x="920" y="170" font-size="10" fill="#8b949e">agent-framework</text></g>
    </g>

    <!-- punchline -->
    <text x="500" y="262" text-anchor="middle" font-size="18" font-weight="700" fill="#e5e7eb" opacity="0">Same person. Same persistence. Harder bugs.
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.74;0.8;0.9;1" dur="16s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
