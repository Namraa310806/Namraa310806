<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Animated diagram of a re-entrant lock deadlock in Celery's Redis result backend and the fix" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="340" rx="18" fill="#0d1117"/>
  <rect x="1" y="1" width="998" height="338" rx="17" fill="none" stroke="#30363d"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="40" font-size="15" fill="#8b949e">// autopsy #2 · celery#10497 · a thread that waits on itself</text>

    <!-- step 1 -->
    <rect x="50" y="110" width="220" height="62" rx="10" fill="#161b22" stroke="#a78bfa" stroke-width="2"/>
    <text x="160" y="137" text-anchor="middle" font-size="15" font-weight="700" fill="#e5e7eb">1 · take PubSub lock</text>
    <text x="160" y="159" text-anchor="middle" font-size="12" fill="#8b949e">redis-py, non-reentrant</text>

    <!-- step 2 -->
    <rect x="390" y="110" width="220" height="62" rx="10" fill="#161b22" stroke="#22d3ee" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="500" y="137" font-size="15" font-weight="700" fill="#e5e7eb" opacity="1">2 · UNSUBSCRIBE
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.49;0.5;1;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="159" font-size="12" fill="#fbbf24" opacity="1">redundant, already done
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.49;0.5;1;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="137" font-size="15" font-weight="700" fill="#34d399" opacity="0">2 · guard
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.51;0.99;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="159" font-size="12" fill="#34d399" opacity="0">already done, skip the call
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.51;0.99;1" dur="12s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- step 3, the bug -->
    <g>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.49;0.5;0.99;1" dur="12s" repeatCount="indefinite"/>
      <rect x="730" y="110" width="220" height="62" rx="10" fill="#161b22" stroke="#f87171" stroke-width="2">
        <animate attributeName="stroke-opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
      </rect>
      <text x="840" y="137" text-anchor="middle" font-size="15" font-weight="700" fill="#e5e7eb">3 · take lock again</text>
      <text x="840" y="159" text-anchor="middle" font-size="12" fill="#f87171">BLOCKED: holds it already</text>
      <g transform="translate(840 215)">
        <circle r="14" fill="none" stroke="#f87171" stroke-width="3" stroke-dasharray="14 74">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.1s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <!-- step 4, the fix -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.52;0.99;1" dur="12s" repeatCount="indefinite"/>
      <rect x="730" y="230" width="220" height="62" rx="10" fill="#161b22" stroke="#34d399" stroke-width="2"/>
      <text x="840" y="257" text-anchor="middle" font-size="15" font-weight="700" fill="#e5e7eb">3 · release lock</text>
      <text x="840" y="279" text-anchor="middle" font-size="12" fill="#34d399">no re-entry, no deadlock</text>
    </g>

    <!-- connectors -->
    <g stroke="#30363d" stroke-width="2" fill="none" stroke-dasharray="6 6">
      <line x1="270" y1="141" x2="390" y2="141"/>
      <line x1="610" y1="141" x2="730" y2="141"/>
      <path d="M500 172 L500 261 L730 261"/>
    </g>

    <!-- packet, buggy path (first half) -->
    <g>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.49;0.5;0.99;1" dur="12s" repeatCount="indefinite"/>
      <g>
        <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.7;1" path="M 160 141 L 840 141"/>
        <circle r="8" fill="#f87171" filter="url(#glow)"/>
      </g>
    </g>
    <!-- packet, fixed path (second half) -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.51;0.99;1" dur="12s" repeatCount="indefinite"/>
      <g>
        <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.7;1" path="M 160 141 L 500 141 L 500 261 L 840 261"/>
        <circle r="8" fill="#34d399" filter="url(#glow)"/>
      </g>
    </g>

    <!-- status -->
    <text x="40" y="318" font-size="14" fill="#f87171" opacity="1">redundant UNSUBSCRIBE re-enters redis-py's non-reentrant PubSub lock: deadlock.
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.49;0.5;0.99;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="318" font-size="14" fill="#34d399" opacity="0">guard the call: lock is never re-entered. regression tests added, merged into 5.7.0.
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.51;0.99;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
