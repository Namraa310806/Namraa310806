<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="Terminal listing upstream bug fixes by Namraa Patel" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="2" y="2" width="996" height="356" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="2" y="2" width="996" height="40" rx="14" fill="#161b22"/>
  <rect x="2" y="30" width="996" height="12" fill="#161b22"/>
  <circle cx="28" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="72" cy="22" r="6" fill="#27c93f"/>
  <text x="500" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8b949e">namraa@upstream: ~/best-bugs-i-found</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#e5e7eb">
    <text x="36" y="86" opacity="0"><tspan fill="#34d399">$</tspan> upstream-fixes --author namraa --top 5
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.04;0.06;0.93;1" dur="16s" repeatCount="indefinite"/>
    </text>
    <text x="36" y="126" opacity="0"><tspan fill="#34d399">✔</tspan> <tspan fill="#22d3ee">celery#10461</tspan>  autoretry_for: mutable retry_kwargs aliased across retries
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.14;0.16;0.93;1" dur="16s" repeatCount="indefinite"/>
    </text>
    <text x="36" y="164" opacity="0"><tspan fill="#34d399">✔</tspan> <tspan fill="#22d3ee">celery#10493</tspan>  hard-timeout leak: traceback_clear() was a silent no-op
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.27;0.93;1" dur="16s" repeatCount="indefinite"/>
    </text>
    <text x="36" y="202" opacity="0"><tspan fill="#34d399">✔</tspan> <tspan fill="#22d3ee">celery#10497</tspan>  redis backend: re-entrant PubSub lock deadlock
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.36;0.38;0.93;1" dur="16s" repeatCount="indefinite"/>
    </text>
    <text x="36" y="240" opacity="0"><tspan fill="#34d399">✔</tspan> <tspan fill="#22d3ee">celery#10510</tspan>  cert expired mid-run, still passed verification
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.47;0.49;0.93;1" dur="16s" repeatCount="indefinite"/>
    </text>
    <text x="36" y="278" opacity="0"><tspan fill="#34d399">✔</tspan> <tspan fill="#f472b6">agent-framework#7901</tspan>  from_dict() mutated the caller's nested dicts
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.58;0.60;0.93;1" dur="16s" repeatCount="indefinite"/>
    </text>
    <text x="36" y="326" opacity="0"><tspan fill="#34d399">$</tspan> ./next_bug --please
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.70;0.72;0.93;1" dur="16s" repeatCount="indefinite"/>
    </text>
    <rect x="228" y="311" width="9" height="19" fill="#a78bfa" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;1;0;1;0;1;0" keyTimes="0;0.72;0.74;0.78;0.82;0.86;0.90;0.93;0.95;1" dur="16s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
