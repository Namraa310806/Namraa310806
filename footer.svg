<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Every wrong answer builds understanding. Every merged PR builds confidence." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.5" stop-color="#302b63"/>
      <stop offset="1" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="txt" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.5" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#f9a8d4"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1000 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="240" rx="18" fill="url(#bg)"/>

  <g fill="#c4b5fd">
    <circle cx="90" cy="40" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="24" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="36" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="26" r="1.8"><animate attributeName="opacity" values="1;0.2;1" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="48" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="5.5s" repeatCount="indefinite"/></circle>
  </g>

  <g text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="25" fill="url(#txt)">
    <g opacity="1">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.45;0.5;1" dur="12s" repeatCount="indefinite"/>
      <text x="500" y="76">My first open-source PR took 9 commits to get merged.</text>
      <text x="500" y="112">Every one of them taught me something.</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.54;0.95;0.99;1" dur="12s" repeatCount="indefinite"/>
      <text x="500" y="76">Every wrong answer builds understanding.</text>
      <text x="500" y="112">Every merged PR builds confidence.</text>
    </g>
  </g>
  <text x="500" y="142" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8b8fb5">· namraa patel ·</text>

  <!-- waves -->
  <g>
    <path d="M0 176 C125 156, 375 196, 500 176 C625 156, 875 196, 1000 176 C1125 156, 1375 196, 1500 176 L1500 240 L0 240 Z" fill="#a78bfa" fill-opacity="0.18">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="14s" repeatCount="indefinite"/>
    </path>
    <path d="M0 192 C125 172, 375 212, 500 192 C625 172, 875 212, 1000 192 C1125 172, 1375 212, 1500 192 L1500 240 L0 240 Z" fill="#22d3ee" fill-opacity="0.16">
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="10s" repeatCount="indefinite"/>
    </path>
    <path d="M0 208 C125 192, 375 224, 500 208 C625 192, 875 224, 1000 208 C1125 192, 1375 224, 1500 208 L1500 240 L0 240 Z" fill="#f472b6" fill-opacity="0.22">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>
  <rect x="1" y="1" width="998" height="238" rx="17" fill="none" stroke="#a78bfa" stroke-opacity="0.35"/>
</svg>
