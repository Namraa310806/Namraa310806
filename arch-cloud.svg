<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="Animated architecture of the Personal Cloud Assistant: React on Amplify, Cognito, API Gateway, Lambda, DynamoDB, S3 and CloudWatch, with no EC2" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="360" rx="18" fill="#0d1117"/>
  <rect x="1" y="1" width="998" height="358" rx="17" fill="none" stroke="#30363d"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="38" font-size="15" fill="#8b949e">// Personal Cloud Assistant · fully serverless, zero EC2 to maintain</text>

    <!-- links -->
    <g stroke="#30363d" stroke-width="2" stroke-dasharray="6 6" fill="none">
      <line x1="180" y1="185" x2="240" y2="185"/>
      <line x1="390" y1="185" x2="450" y2="185"/>
      <line x1="600" y1="185" x2="700" y2="115"/>
      <line x1="600" y1="185" x2="700" y2="255"/>
      <line x1="525" y1="220" x2="525" y2="280"/>
    </g>
    <!-- auth links -->
    <g stroke="#f472b6" stroke-width="2" stroke-dasharray="4 5" fill="none" stroke-opacity="0.8">
      <path d="M 105 150 L 240 90"><animate attributeName="stroke-dashoffset" from="0" to="-18" dur="0.9s" repeatCount="indefinite"/></path>
      <path d="M 315 116 L 315 150"><animate attributeName="stroke-dashoffset" from="0" to="-18" dur="0.9s" repeatCount="indefinite"/></path>
    </g>
    <text x="118" y="112" font-size="12" fill="#f472b6">JWT</text>

    <!-- nodes -->
    <g font-size="15" font-weight="700" text-anchor="middle">
      <rect x="30" y="150" width="150" height="70" rx="12" fill="#161b22" stroke="#61DAFB"/>
      <text x="105" y="182" fill="#e5e7eb">React 19</text>
      <text x="105" y="203" font-size="12" font-weight="400" fill="#8b949e">Amplify CI/CD</text>

      <rect x="240" y="54" width="150" height="62" rx="12" fill="#161b22" stroke="#f472b6"/>
      <text x="315" y="82" fill="#e5e7eb">Cognito</text>
      <text x="315" y="102" font-size="12" font-weight="400" fill="#8b949e">JWT auth</text>

      <rect x="240" y="150" width="150" height="70" rx="12" fill="#161b22" stroke="#FF9900"/>
      <text x="315" y="182" fill="#e5e7eb">API Gateway</text>
      <text x="315" y="203" font-size="12" font-weight="400" fill="#8b949e">stateless REST</text>

      <rect x="450" y="150" width="150" height="70" rx="12" fill="#161b22" stroke="#FF9900"/>
      <text x="525" y="182" fill="#e5e7eb">Lambda</text>
      <text x="525" y="203" font-size="12" font-weight="400" fill="#8b949e">least-privilege IAM</text>

      <rect x="700" y="80" width="170" height="70" rx="12" fill="#161b22" stroke="#4053D6"/>
      <text x="785" y="112" fill="#e5e7eb">DynamoDB</text>
      <text x="785" y="133" font-size="12" font-weight="400" fill="#8b949e">notes</text>

      <rect x="700" y="220" width="170" height="70" rx="12" fill="#161b22" stroke="#3F8624"/>
      <text x="785" y="252" fill="#e5e7eb">S3</text>
      <text x="785" y="273" font-size="12" font-weight="400" fill="#8b949e">files via presigned URLs</text>

      <rect x="450" y="280" width="150" height="56" rx="12" fill="#161b22" stroke="#E7157B"/>
      <text x="525" y="304" fill="#e5e7eb">CloudWatch</text>
      <text x="525" y="324" font-size="12" font-weight="400" fill="#8b949e">custom metrics</text>
    </g>
    <text x="620" y="312" font-size="12" fill="#8b949e">→ admin-only monitoring dashboard</text>

    <!-- request packets -->
    <g>
      <g>
        <animateMotion dur="6s" begin="0s" repeatCount="indefinite" path="M 105 185 L 525 185 L 785 115"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.92;1" dur="6s" repeatCount="indefinite"/>
        <circle r="7" fill="#a78bfa" filter="url(#glow)"/>
      </g>
      <g>
        <animateMotion dur="6s" begin="-3s" repeatCount="indefinite" path="M 105 185 L 525 185 L 785 255"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.92;1" dur="6s" begin="-3s" repeatCount="indefinite"/>
        <circle r="7" fill="#34d399" filter="url(#glow)"/>
      </g>
      <g>
        <animateMotion dur="3s" begin="-1s" repeatCount="indefinite" path="M 525 185 L 525 308"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3s" begin="-1s" repeatCount="indefinite"/>
        <circle r="5" fill="#E7157B" filter="url(#glow)"/>
      </g>
    </g>

    <rect x="880" y="150" width="96" height="70" rx="12" fill="#0d1117" stroke="#34d399" stroke-opacity="0.7"/>
    <text x="928" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#34d399">no EC2</text>
    <text x="928" y="195" text-anchor="middle" font-size="11" fill="#6ee7b7">zero fixed</text>
    <text x="928" y="209" text-anchor="middle" font-size="11" fill="#6ee7b7">server cost</text>
  </g>
</svg>
