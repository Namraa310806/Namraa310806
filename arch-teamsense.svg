<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Animated architecture of TeamSense: React dashboard, DRF API, Redis queue, Celery workers, PostgreSQL, all containerized with Docker" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="320" rx="18" fill="#0d1117"/>
  <rect x="1" y="1" width="998" height="318" rx="17" fill="none" stroke="#30363d"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="38" font-size="15" fill="#8b949e">// TeamSense · heavy work leaves the request cycle</text>

    <!-- docker boundary -->
    <rect x="205" y="62" width="770" height="170" rx="16" fill="none" stroke="#2496ED" stroke-opacity="0.6" stroke-dasharray="8 6"/>
    <text x="222" y="84" font-size="12" fill="#2496ED">docker · reproducible dev and prod</text>

    <!-- nodes -->
    <g font-size="15" font-weight="700" text-anchor="middle">
      <rect x="30" y="120" width="150" height="80" rx="12" fill="#161b22" stroke="#61DAFB"/>
      <text x="105" y="155" fill="#e5e7eb">React</text>
      <text x="105" y="177" font-size="12" font-weight="400" fill="#8b949e">dashboard</text>

      <rect x="225" y="120" width="150" height="80" rx="12" fill="#161b22" stroke="#44B78B"/>
      <text x="300" y="155" fill="#e5e7eb">DRF API</text>
      <text x="300" y="177" font-size="12" font-weight="400" fill="#8b949e">replies immediately</text>

      <rect x="420" y="120" width="150" height="80" rx="12" fill="#161b22" stroke="#FF4438"/>
      <text x="495" y="147" fill="#e5e7eb">Redis queue</text>

      <rect x="615" y="120" width="170" height="80" rx="12" fill="#161b22" stroke="#37814A"/>
      <text x="700" y="147" fill="#e5e7eb">Celery workers</text>
      <text x="700" y="186" font-size="12" font-weight="400" fill="#8b949e">feedback processing</text>

      <rect x="830" y="120" width="130" height="80" rx="12" fill="#161b22" stroke="#5B8DEF"/>
      <text x="895" y="150" fill="#e5e7eb">PostgreSQL</text>
      <text x="895" y="172" font-size="11" font-weight="400" fill="#8b949e">employees</text>
      <text x="895" y="187" font-size="11" font-weight="400" fill="#8b949e">meetings · feedback</text>
    </g>

    <!-- queue slots -->
    <g fill="#FF4438">
      <rect x="445" y="160" width="22" height="22" rx="4"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="0s" repeatCount="indefinite"/></rect>
      <rect x="474" y="160" width="22" height="22" rx="4"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="0.3s" repeatCount="indefinite"/></rect>
      <rect x="503" y="160" width="22" height="22" rx="4"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="0.6s" repeatCount="indefinite"/></rect>
      <rect x="532" y="160" width="22" height="22" rx="4"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="0.9s" repeatCount="indefinite"/></rect>
    </g>

    <!-- worker pulses -->
    <g fill="#37814A">
      <circle cx="660" cy="166" r="7"><animate attributeName="r" values="5;9;5" dur="1.2s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="166" r="7"><animate attributeName="r" values="5;9;5" dur="1.2s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="740" cy="166" r="7"><animate attributeName="r" values="5;9;5" dur="1.2s" begin="0.8s" repeatCount="indefinite"/></circle>
    </g>

    <!-- links -->
    <g stroke="#30363d" stroke-width="2" stroke-dasharray="6 6" fill="none">
      <line x1="180" y1="160" x2="225" y2="160"/>
      <line x1="375" y1="160" x2="420" y2="160"/>
      <line x1="570" y1="160" x2="615" y2="160"/>
      <line x1="785" y1="160" x2="830" y2="160"/>
    </g>

    <!-- request packets -->
    <g>
      <g>
        <animateMotion dur="6s" begin="0s" repeatCount="indefinite" path="M 105 160 L 895 160"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.92;1" dur="6s" repeatCount="indefinite"/>
        <circle r="7" fill="#a78bfa" filter="url(#glow)"/>
      </g>
      <g>
        <animateMotion dur="6s" begin="-2s" repeatCount="indefinite" path="M 105 160 L 895 160"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.92;1" dur="6s" begin="-2s" repeatCount="indefinite"/>
        <circle r="7" fill="#22d3ee" filter="url(#glow)"/>
      </g>
      <g>
        <animateMotion dur="6s" begin="-4s" repeatCount="indefinite" path="M 105 160 L 895 160"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.92;1" dur="6s" begin="-4s" repeatCount="indefinite"/>
        <circle r="7" fill="#f472b6" filter="url(#glow)"/>
      </g>
    </g>

    <!-- instant reply (fast path) -->
    <path d="M 300 120 C 300 90, 105 90, 105 120" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="4 5" stroke-opacity="0.8">
      <animate attributeName="stroke-dashoffset" from="0" to="-18" dur="0.8s" repeatCount="indefinite"/>
    </path>

    <!-- metric -->
    <rect x="30" y="256" width="350" height="44" rx="22" fill="#0d1117" stroke="#34d399" stroke-opacity="0.7"/>
    <text x="205" y="284" text-anchor="middle" font-size="16" font-weight="700" fill="#34d399">−60% synchronous processing load</text>
    <text x="970" y="284" text-anchor="end" font-size="12" fill="#8b949e">Django · DRF · Celery · Redis · PostgreSQL · Docker · React</text>
  </g>
</svg>
