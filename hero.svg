<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Namraa Patel - backend engineer and open source contributor" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.5" stop-color="#302b63"/>
      <stop offset="1" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.35" stop-color="#22d3ee"/>
      <stop offset="0.7" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#a78bfa"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1000 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="300" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="298" rx="17" fill="none" stroke="#a78bfa" stroke-opacity="0.35"/>

  <!-- floating particles -->
  <g fill="#c4b5fd">
    <circle cx="70" cy="40" r="2"><animate attributeName="cy" values="40;10;40" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.9;0.2" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="270" r="1.6"><animate attributeName="cy" values="270;235;270" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0.2;0.9" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="30" r="2.2"><animate attributeName="cy" values="30;60;30" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="275" r="1.5"><animate attributeName="cy" values="275;240;275" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.8;0.2" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="45" r="1.8"><animate attributeName="cy" values="45;15;45" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0.2;0.8" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="260" r="2.4"><animate attributeName="cy" values="260;225;260" dur="6.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="6.5s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="25" r="1.6"><animate attributeName="cy" values="25;55;25" dur="7.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0.3;0.9" dur="7.5s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="40" r="2"><animate attributeName="cy" values="40;15;40" dur="5.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;0.9;0.3" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="975" cy="270" r="1.8"><animate attributeName="cy" values="270;240;270" dur="8.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0.2;0.8" dur="8.5s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="150" r="1.4"><animate attributeName="cx" values="40;55;40" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.8;0.2" dur="6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- scan line -->
  <rect x="0" y="0" width="1000" height="2" fill="#ffffff" opacity="0.07">
    <animate attributeName="y" values="0;300" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- orbit system -->
  <g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 830 150" to="360 830 150" dur="14s" repeatCount="indefinite"/>
      <circle cx="830" cy="150" r="62" fill="none" stroke="#a78bfa" stroke-opacity="0.45" stroke-dasharray="3 7"/>
      <circle cx="892" cy="150" r="6" fill="#34d399" filter="url(#glow)"/>
      <circle cx="768" cy="150" r="4" fill="#22d3ee" filter="url(#glow)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 830 150" to="0 830 150" dur="22s" repeatCount="indefinite"/>
      <circle cx="830" cy="150" r="106" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-dasharray="2 9"/>
      <circle cx="830" cy="44" r="7" fill="#f472b6" filter="url(#glow)"/>
      <circle cx="936" cy="150" r="4.5" fill="#fbbf24" filter="url(#glow)"/>
      <circle cx="777" cy="242" r="5" fill="#60a5fa" filter="url(#glow)"/>
    </g>
    <circle cx="830" cy="150" r="28" fill="url(#core)" filter="url(#glow)">
      <animate attributeName="r" values="26;31;26" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="830" y="156" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#fff">&lt;/&gt;</text>
  </g>

  <!-- text -->
  <text x="60" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8b8fb5">// namraa@pdeu:~$ whoami</text>
  <text x="58" y="148" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="url(#shimmer)">Namraa Patel</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#c4b5fd">
    <text x="60" y="195" opacity="0">Backend · Distributed systems · Cloud
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.30;0.33;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="195" opacity="0">Fixing concurrency bugs in Celery, upstream
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.36;0.63;0.66;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="195" opacity="0">Codeforces Expert 1731 · LeetCode 2207
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.66;0.69;0.96;0.99;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- status pill -->
  <rect x="58" y="224" width="470" height="36" rx="18" fill="#0d1117" fill-opacity="0.55" stroke="#34d399" stroke-opacity="0.5"/>
  <circle cx="80" cy="242" r="5" fill="#34d399">
    <animate attributeName="r" values="4;7;4" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="98" y="247" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#e5e7eb">open to Summer 2027 · SDE / Backend / ML internships</text>
</svg>
