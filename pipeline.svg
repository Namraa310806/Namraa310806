<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Animated pipeline: detect, reproduce, fix and test, ship upstream" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="300" rx="18" fill="#0d1117"/>
  <rect x="1" y="1" width="998" height="298" rx="17" fill="none" stroke="#30363d"/>

  <text x="40" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#8b949e">// how a bug becomes a shipped fix</text>

  <!-- stations -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g>
      <rect x="40" y="70" width="210" height="84" rx="12" fill="#161b22" stroke="#a78bfa" stroke-opacity="0.7"/>
      <text x="60" y="102" font-size="16" font-weight="700" fill="#a78bfa">01 · DETECT</text>
      <text x="60" y="128" font-size="13" fill="#8b949e">trace it to the root cause</text>
    </g>
    <g>
      <rect x="276" y="70" width="210" height="84" rx="12" fill="#161b22" stroke="#22d3ee" stroke-opacity="0.7"/>
      <text x="296" y="102" font-size="16" font-weight="700" fill="#22d3ee">02 · REPRODUCE</text>
      <text x="296" y="128" font-size="13" fill="#8b949e">minimal failing case</text>
    </g>
    <g>
      <rect x="512" y="70" width="210" height="84" rx="12" fill="#161b22" stroke="#f472b6" stroke-opacity="0.7"/>
      <text x="532" y="102" font-size="16" font-weight="700" fill="#f472b6">03 · FIX + TEST</text>
      <text x="532" y="128" font-size="13" fill="#8b949e">regression tests that stay</text>
    </g>
    <g>
      <rect x="748" y="70" width="212" height="84" rx="12" fill="#161b22" stroke="#34d399" stroke-opacity="0.8"/>
      <text x="768" y="102" font-size="16" font-weight="700" fill="#34d399">04 · SHIPPED</text>
      <text x="768" y="128" font-size="13" fill="#8b949e">upstream, Celery 5.7.0</text>
      <circle cx="930" cy="92" r="9" fill="none" stroke="#34d399">
        <animate attributeName="r" values="8;15;8" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0;0.9" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- drop lines to the conveyor -->
  <g stroke="#30363d" stroke-dasharray="3 5">
    <line x1="145" y1="154" x2="145" y2="215"/>
    <line x1="381" y1="154" x2="381" y2="215"/>
    <line x1="617" y1="154" x2="617" y2="215"/>
    <line x1="854" y1="154" x2="854" y2="215"/>
  </g>

  <!-- conveyor -->
  <line x1="40" y1="215" x2="960" y2="215" stroke="#a78bfa" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="10 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- packets -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" text-anchor="middle">
    <g>
      <animateMotion dur="12s" begin="0s" repeatCount="indefinite" path="M 40 215 L 960 215"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.92;1" dur="12s" repeatCount="indefinite"/>
      <circle r="8" fill="#a78bfa" filter="url(#glow)"/>
      <text y="-16" fill="#c4b5fd">celery#10461</text>
    </g>
    <g>
      <animateMotion dur="12s" begin="-2.4s" repeatCount="indefinite" path="M 40 215 L 960 215"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.92;1" dur="12s" begin="-2.4s" repeatCount="indefinite"/>
      <circle r="8" fill="#22d3ee" filter="url(#glow)"/>
      <text y="-16" fill="#67e8f9">celery#10493</text>
    </g>
    <g>
      <animateMotion dur="12s" begin="-4.8s" repeatCount="indefinite" path="M 40 215 L 960 215"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.92;1" dur="12s" begin="-4.8s" repeatCount="indefinite"/>
      <circle r="8" fill="#f472b6" filter="url(#glow)"/>
      <text y="-16" fill="#f9a8d4">celery#10497</text>
    </g>
    <g>
      <animateMotion dur="12s" begin="-7.2s" repeatCount="indefinite" path="M 40 215 L 960 215"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.92;1" dur="12s" begin="-7.2s" repeatCount="indefinite"/>
      <circle r="8" fill="#fbbf24" filter="url(#glow)"/>
      <text y="-16" fill="#fcd34d">celery#10510</text>
    </g>
    <g>
      <animateMotion dur="12s" begin="-9.6s" repeatCount="indefinite" path="M 40 215 L 960 215"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.92;1" dur="12s" begin="-9.6s" repeatCount="indefinite"/>
      <circle r="8" fill="#34d399" filter="url(#glow)"/>
      <text y="-16" fill="#6ee7b7">maf#7901</text>
    </g>
  </g>

  <text x="500" y="268" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8b949e">Celery · Microsoft Agent Framework · Open Food Facts</text>
</svg>
