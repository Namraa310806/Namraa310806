<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-label="Winner of JPMorgan Chase Code for Good 2026: built a production-ready solution for a nonprofit partner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1405"/>
      <stop offset="0.5" stop-color="#2a1f08"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="goldtxt" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="400" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#fff7d6"/>
      <stop offset="1" stop-color="#fbbf24"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="800 0" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="200" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="198" rx="17" fill="none" stroke="#fbbf24" stroke-opacity="0.55">
    <animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- confetti -->
  <g>
    <rect x="260" y="-10" width="7" height="12" fill="#fbbf24"><animate attributeName="y" values="-10;210" dur="5s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="rotate" values="0 263 100;360 263 100" dur="2s" repeatCount="indefinite"/></rect>
    <rect x="420" y="-10" width="6" height="10" fill="#f472b6"><animate attributeName="y" values="-10;210" dur="6.5s" begin="-2s" repeatCount="indefinite"/></rect>
    <rect x="560" y="-10" width="7" height="11" fill="#22d3ee"><animate attributeName="y" values="-10;210" dur="5.5s" begin="-1s" repeatCount="indefinite"/></rect>
    <rect x="700" y="-10" width="6" height="10" fill="#fde68a"><animate attributeName="y" values="-10;210" dur="7s" begin="-3s" repeatCount="indefinite"/></rect>
    <rect x="840" y="-10" width="7" height="12" fill="#a78bfa"><animate attributeName="y" values="-10;210" dur="6s" begin="-4s" repeatCount="indefinite"/></rect>
    <rect x="920" y="-10" width="6" height="10" fill="#fbbf24"><animate attributeName="y" values="-10;210" dur="5s" begin="-2.5s" repeatCount="indefinite"/></rect>
    <rect x="340" y="-10" width="5" height="9" fill="#34d399"><animate attributeName="y" values="-10;210" dur="6.2s" begin="-5s" repeatCount="indefinite"/></rect>
  </g>

  <!-- trophy -->
  <g transform="translate(78 44)">
    <animateTransform attributeName="transform" type="translate" values="78 44;78 38;78 44" dur="3s" repeatCount="indefinite"/>
    <g filter="url(#glow)">
      <path d="M-4 14 H-18 C-18 44 -2 50 8 50" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
      <path d="M74 14 H88 C88 44 72 50 62 50" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
      <path d="M0 0 H70 V34 C70 58 54 74 35 74 C16 74 0 58 0 34 Z" fill="url(#gold)"/>
      <rect x="30" y="74" width="10" height="26" fill="url(#gold)"/>
      <rect x="12" y="100" width="46" height="12" rx="4" fill="url(#gold)"/>
    </g>
    <text x="35" y="48" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" fill="#fff7d6">★</text>
  </g>

  <!-- sparkles -->
  <g fill="#fff7d6" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="40" y="40" font-size="18"><animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite"/>✦</text>
    <text x="170" y="60" font-size="14"><animate attributeName="opacity" values="1;0;1" dur="2.8s" repeatCount="indefinite"/>✦</text>
    <text x="160" y="170" font-size="16"><animate attributeName="opacity" values="0;1;0" dur="3s" begin="-1s" repeatCount="indefinite"/>✦</text>
  </g>

  <text x="215" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="6" font-weight="700" fill="url(#goldtxt)">★ WINNER ★</text>
  <text x="213" y="114" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#fff7d6">JPMorgan Chase Code for Good 2026</text>
  <text x="215" y="150" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#d6c9a0">Built a production-ready solution for a nonprofit partner.</text>
</svg>
