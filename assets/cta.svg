<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Call to action: Got a bug that only shows up in production? Let's talk. Open to Summer 2027 internships." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.5" stop-color="#302b63"/>
      <stop offset="1" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="txt" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1000 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="240" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="238" rx="17" fill="none" stroke="#a78bfa" stroke-opacity="0.4"/>

  <g fill="#c4b5fd">
    <circle cx="80" cy="40" r="2"><animate attributeName="cy" values="40;18;40" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="210" r="1.8"><animate attributeName="cy" values="210;188;210" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.2;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="30" r="2.2"><animate attributeName="cy" values="30;52;30" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;1;0.3" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="205" r="2"><animate attributeName="cy" values="205;180;205" dur="5.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.3;1" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="48" r="1.6"><animate attributeName="cy" values="48;22;48" dur="6.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.9;0.2" dur="6.5s" repeatCount="indefinite"/></circle>
  </g>

  <g text-anchor="middle">
    <text x="500" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8b8fb5">$ ping namraa</text>
    <text x="500" y="122" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="33" font-weight="800" fill="url(#txt)">Got a bug that only shows up in production?</text>
    <text x="500" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#e5e7eb">Open to Summer 2027 · SDE / Backend / ML internships</text>

    <rect x="300" y="178" width="400" height="42" rx="21" fill="#0d1117" fill-opacity="0.7" stroke="#34d399" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </rect>
    <circle cx="326" cy="199" r="5" fill="#34d399">
      <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="512" y="205" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#34d399">patelnamraa88@gmail.com</text>
  </g>
</svg>
