<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Animated architecture of the C++20 matching engine: order producers feed a lock-free SPSC queue, a single matching thread consumes it against a sorted-vector order book with intrusive lists, backed by a freelist object pool. Cancel-heavy throughput rose from 13.7 thousand to 3.81 million operations per second.">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="340" rx="18" fill="#0d1117"/>
  <rect x="1" y="1" width="998" height="338" rx="17" fill="none" stroke="#30363d"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="38" font-size="15" fill="#a8b0bd">// Matching engine · price-time priority, lock-free ingestion</text>

    <!-- single-writer boundary -->
    <rect x="455" y="62" width="520" height="176" rx="16" fill="none" stroke="#a78bfa" stroke-opacity="0.6" stroke-dasharray="8 6"/>
    <text x="472" y="84" font-size="12" fill="#c4b5fd">single-writer matching thread · no locks on the hot path</text>

    <g font-size="15" font-weight="700" text-anchor="middle">
      <rect x="30" y="120" width="150" height="80" rx="12" fill="#161b22" stroke="#22d3ee"/>
      <text x="105" y="153" fill="#e5e7eb">Order flow</text>
      <text x="105" y="176" font-size="12" font-weight="400" fill="#a8b0bd">orders · cancels</text>

      <rect x="225" y="120" width="200" height="80" rx="12" fill="#161b22" stroke="#f472b6"/>
      <text x="325" y="146" fill="#e5e7eb">SPSC queue</text>
      <text x="325" y="190" font-size="12" font-weight="400" fill="#a8b0bd">acquire / release ordering</text>

      <rect x="490" y="112" width="200" height="96" rx="12" fill="#161b22" stroke="#34d399"/>
      <text x="590" y="140" fill="#e5e7eb">Matching core</text>
      <text x="590" y="162" font-size="12" font-weight="400" fill="#a8b0bd">partial fills · cancels</text>
      <text x="590" y="182" font-size="12" font-weight="400" fill="#a8b0bd">multi-instrument</text>

      <rect x="740" y="112" width="205" height="96" rx="12" fill="#161b22" stroke="#fbbf24"/>
      <text x="842" y="140" fill="#e5e7eb">Order book</text>
      <text x="842" y="160" font-size="12" font-weight="400" fill="#a8b0bd">sorted vector + lists</text>
      <text x="842" y="180" font-size="12" font-weight="400" fill="#a8b0bd">O(1) cancel</text>
    </g>

    <!-- queue slots (ring buffer) -->
    <g fill="#f472b6">
      <rect x="245" y="156" width="20" height="20" rx="4"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="0s" repeatCount="indefinite"/></rect>
      <rect x="272" y="156" width="20" height="20" rx="4"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="0.25s" repeatCount="indefinite"/></rect>
      <rect x="299" y="156" width="20" height="20" rx="4"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="0.5s" repeatCount="indefinite"/></rect>
      <rect x="326" y="156" width="20" height="20" rx="4"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="0.75s" repeatCount="indefinite"/></rect>
      <rect x="353" y="156" width="20" height="20" rx="4"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="1s" repeatCount="indefinite"/></rect>
      <rect x="380" y="156" width="20" height="20" rx="4"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="1.25s" repeatCount="indefinite"/></rect>
    </g>

    <!-- links -->
    <g stroke="#3d4655" stroke-width="2" stroke-dasharray="6 6" fill="none">
      <line x1="180" y1="160" x2="225" y2="160"/>
      <line x1="425" y1="160" x2="490" y2="160"/>
      <line x1="690" y1="160" x2="740" y2="160"/>
    </g>

    <!-- order packets -->
    <g>
      <g>
        <animateMotion dur="5s" begin="0s" repeatCount="indefinite" path="M 105 160 L 842 160"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.92;1" dur="5s" repeatCount="indefinite"/>
        <circle r="7" fill="#22d3ee" filter="url(#glow)"/>
      </g>
      <g>
        <animateMotion dur="5s" begin="-1.7s" repeatCount="indefinite" path="M 105 160 L 842 160"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.92;1" dur="5s" begin="-1.7s" repeatCount="indefinite"/>
        <circle r="7" fill="#a78bfa" filter="url(#glow)"/>
      </g>
      <g>
        <animateMotion dur="5s" begin="-3.4s" repeatCount="indefinite" path="M 105 160 L 842 160"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.92;1" dur="5s" begin="-3.4s" repeatCount="indefinite"/>
        <circle r="7" fill="#f472b6" filter="url(#glow)"/>
      </g>
    </g>

    <!-- object pool recycle loop -->
    <path d="M 590 208 C 590 262, 842 262, 842 208" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="4 5" stroke-opacity="0.85">
      <animate attributeName="stroke-dashoffset" from="0" to="-18" dur="0.8s" repeatCount="indefinite"/>
    </path>
    <text x="716" y="282" text-anchor="middle" font-size="12" fill="#6ee7b7">freelist object pool · 99.99% hit rate, no hot-path allocation</text>

    <!-- metric -->
    <rect x="30" y="268" width="330" height="44" rx="22" fill="#0d1117" stroke="#34d399" stroke-opacity="0.7"/>
    <text x="195" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#34d399">13.7K → 3.81M ops/s · 278×</text>
    <text x="970" y="318" text-anchor="end" font-size="12" fill="#a8b0bd">C++20 · CMake · GoogleTest · Google Benchmark · TSan / ASan / UBSan</text>
  </g>
</svg>
