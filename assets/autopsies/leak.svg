<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Animated diagram of a reference cycle leak in Celery hard timeout and the fix" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f87171"/>
    </marker>
  </defs>

  <rect width="1000" height="340" rx="18" fill="#0d1117"/>
  <rect x="1" y="1" width="998" height="338" rx="17" fill="none" stroke="#30363d"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="40" font-size="15" fill="#8b949e">// autopsy #1 · celery#10493 · the leak that could not be freed</text>

    <!-- arrows of the cycle -->
    <g stroke="#f87171" stroke-width="2.5" fill="none" marker-end="url(#arrR)">
      <path d="M215 110 L362 110">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.56;0.97;1" dur="12s" repeatCount="indefinite"/>
      </path>
      <path d="M422 136 L338 213"/>
      <path d="M244 213 L160 136"/>
    </g>

    <!-- nodes -->
    <g stroke-width="2" fill="#161b22">
      <rect x="65" y="85" width="150" height="50" rx="10" stroke="#f87171">
        <animate attributeName="stroke" values="#f87171;#f87171;#34d399;#34d399;#f87171" keyTimes="0;0.5;0.56;0.97;1" dur="12s" repeatCount="indefinite"/>
      </rect>
      <rect x="365" y="85" width="150" height="50" rx="10" stroke="#f87171">
        <animate attributeName="stroke" values="#f87171;#f87171;#34d399;#34d399;#f87171" keyTimes="0;0.5;0.56;0.97;1" dur="12s" repeatCount="indefinite"/>
      </rect>
      <rect x="215" y="215" width="150" height="50" rx="10" stroke="#f87171">
        <animate attributeName="stroke" values="#f87171;#f87171;#34d399;#34d399;#f87171" keyTimes="0;0.5;0.56;0.97;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g font-size="15" font-weight="700" fill="#e5e7eb" text-anchor="middle">
      <text x="140" y="116">exception</text>
      <text x="440" y="116">traceback</text>
      <text x="290" y="246">frame</text>
    </g>
    <text x="290" y="72" text-anchor="middle" font-size="13" fill="#34d399" opacity="0">✂  exc.__traceback__ = None
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.56;0.97;1" dur="12s" repeatCount="indefinite"/>
    </text>

    <!-- packets circling the cycle -->
    <g>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.53;0.97;1" dur="12s" repeatCount="indefinite"/>
      <g>
        <animateMotion dur="3s" repeatCount="indefinite" path="M140 110 L440 110 L290 240 Z"/>
        <circle r="7" fill="#f87171" filter="url(#glow)"/>
      </g>
      <g>
        <animateMotion dur="3s" begin="-1s" repeatCount="indefinite" path="M140 110 L440 110 L290 240 Z"/>
        <circle r="7" fill="#fb923c" filter="url(#glow)"/>
      </g>
      <g>
        <animateMotion dur="3s" begin="-2s" repeatCount="indefinite" path="M140 110 L440 110 L290 240 Z"/>
        <circle r="7" fill="#f87171" filter="url(#glow)"/>
      </g>
    </g>

    <!-- memory gauge -->
    <text x="800" y="70" text-anchor="middle" font-size="13" fill="#8b949e">memory held</text>
    <rect x="770" y="85" width="60" height="190" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect x="774" y="271" width="52" height="0" rx="5" fill="#f87171">
      <animate attributeName="height" values="16;180;0;0;16" keyTimes="0;0.5;0.56;0.97;1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="y" values="255;91;271;271;255" keyTimes="0;0.5;0.56;0.97;1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#f87171;#f87171;#34d399;#34d399;#f87171" keyTimes="0;0.5;0.56;0.97;1" dur="12s" repeatCount="indefinite"/>
    </rect>

    <!-- status lines -->
    <text x="40" y="312" font-size="14" fill="#f87171" opacity="1">cycle intact: refcount never hits 0. traceback_clear(exc) was a no-op, frame still on stack.
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.53;0.97;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="312" font-size="14" fill="#34d399" opacity="0">cycle broken: dead call removed, exception freed. regression + smoke tests added.
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.53;0.57;0.97;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
