<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Animated diagram of a Redis chord race in Celery where two workers could both publish the callback, and the atomic claim that lets only one dispatch it">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker>
  </defs>
  <rect width="1000" height="340" rx="18" fill="#0d1117"/>
  <rect x="1" y="1" width="998" height="338" rx="17" fill="none" stroke="#30363d"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="40" font-size="15" fill="#8b949e">// autopsy #3 · celery#10998 · two workers, one callback</text>

    <!-- workers -->
    <rect x="50" y="95" width="210" height="66" rx="10" fill="#161b22" stroke="#22d3ee" stroke-width="2"/>
    <text x="155" y="123" text-anchor="middle" font-size="15" font-weight="700" fill="#e5e7eb">worker A</text>
    <text x="155" y="145" text-anchor="middle" font-size="12" fill="#8b949e">last chord part finishes</text>
    <rect x="50" y="205" width="210" height="66" rx="10" fill="#161b22" stroke="#a78bfa" stroke-width="2"/>
    <text x="155" y="233" text-anchor="middle" font-size="15" font-weight="700" fill="#e5e7eb">worker B</text>
    <text x="155" y="255" text-anchor="middle" font-size="12" fill="#8b949e">finishes at the same moment</text>

    <!-- redis -->
    <rect x="395" y="140" width="210" height="76" rx="10" fill="#161b22" stroke="#f87171" stroke-width="2"/>
    <text x="500" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#e5e7eb">Redis · chord state</text>
    <text x="500" y="192" text-anchor="middle" font-size="12" fill="#8b949e">completion check</text>

    <!-- callback -->
    <rect x="740" y="140" width="210" height="76" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="845" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#e5e7eb">chord callback</text>

    <!-- static arrows -->
    <path d="M260 128 C 330 128, 330 170, 392 170" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M260 238 C 330 238, 330 190, 392 190" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M605 178 L 736 178" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>

    <!-- BEFORE -->
    <g opacity="1">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.49;0.5;0.99;1" dur="12s" repeatCount="indefinite"/>
      <text x="500" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#f87171">BEFORE</text>
      <text x="500" y="238" text-anchor="middle" font-size="12" fill="#fbbf24">both see "all parts done"</text>
      <text x="845" y="192" text-anchor="middle" font-size="12" fill="#f87171">published twice</text>
      <circle r="5" fill="#22d3ee" filter="url(#glow)"><animateMotion dur="2.4s" repeatCount="indefinite" path="M260 128 C 330 128, 330 170, 392 170 L 500 178 L 740 170"/></circle>
      <circle r="5" fill="#a78bfa" filter="url(#glow)"><animateMotion dur="2.4s" repeatCount="indefinite" path="M260 238 C 330 238, 330 190, 392 190 L 500 178 L 740 188"/></circle>
      <rect x="740" y="140" width="210" height="76" rx="10" fill="none" stroke="#f87171" stroke-width="2"><animate attributeName="stroke-opacity" values="1;0.25;1" dur="1s" repeatCount="indefinite"/></rect>
      <text x="500" y="300" text-anchor="middle" font-size="14" fill="#f87171">duplicate callback, or a result that goes missing</text>
    </g>

    <!-- AFTER -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.51;0.99;1" dur="12s" repeatCount="indefinite"/>
      <text x="500" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#34d399">AFTER</text>
      <rect x="395" y="140" width="210" height="76" rx="10" fill="none" stroke="#34d399" stroke-width="2"/>
      <text x="500" y="238" text-anchor="middle" font-size="12" fill="#34d399">one atomic Lua claim</text>
      <text x="155" y="182" text-anchor="middle" font-size="12" fill="#34d399">token T1 ✓</text>
      <text x="155" y="292" text-anchor="middle" font-size="12" fill="#8b949e">no token, skip</text>
      <text x="845" y="192" text-anchor="middle" font-size="12" fill="#34d399">dispatched once</text>
      <circle r="5" fill="#22d3ee" filter="url(#glow)"><animateMotion dur="2.4s" repeatCount="indefinite" path="M260 128 C 330 128, 330 170, 392 170 L 500 178 L 740 178"/></circle>
      <circle r="4" fill="#8b949e"><animateMotion dur="2.4s" repeatCount="indefinite" path="M260 238 C 330 238, 330 190, 392 190 L 450 190"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.6;0.7;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <rect x="740" y="140" width="210" height="76" rx="10" fill="none" stroke="#34d399" stroke-width="2"/>
      <text x="500" y="300" text-anchor="middle" font-size="14" fill="#34d399">cleanup deletes the claim only if the token still matches</text>
    </g>
  </g>
</svg>